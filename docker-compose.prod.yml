services:
  postgres:
    image: postgres:15-alpine
    container_name: wad_prod_postgres
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wad_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-wishes_and_doos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wad_user} -d ${POSTGRES_DB:-wishes_and_doos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wad_network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: wad_prod_api
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-wad_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wishes_and_doos}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be configured in .env.production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be configured in .env.production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      RUN_MIGRATIONS: "true"
      FLASK_AUTO_CREATE_DB: "false"
      FLASK_SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      ENABLE_PROXY_FIX: "true"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wad_network

  web:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-/api/v1}
    container_name: wad_prod_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - wad_network

volumes:
  postgres_data:
  uploads_data:

networks:
  wad_network:
    driver: bridge
