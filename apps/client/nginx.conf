server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow up to 10MB file uploads (e.g. high-res images for wishes)
    client_max_body_size 10M;

    # Gzip compression for fast loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Immutable cache for static hashed assets
    location /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static assets like fonts, icons, images
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # HTML and metadata should not be aggressively cached
    location ~* \.(?:html|json)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Redirect apex / to /welcome (SEO consolidation P0-4)
    location = / {
        return 301 /welcome;
    }

    # Explicit robots and sitemap serving
    location = /robots.txt {
        default_type text/plain;
        try_files /robots.txt =404;
        access_log off;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files /sitemap.xml =404;
        access_log off;
    }

    # Reverse proxy API requests to Flask backend when co-located in Docker
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static SSG route serving with real 404 page (eliminates soft-404)
    error_page 404 /+not-found.html;

    location / {
        try_files $uri $uri.html $uri/index.html $uri/ /index.html =404;
    }

    # Healthcheck endpoint for orchestrators (Kubernetes / Docker)
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
