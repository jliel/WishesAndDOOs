name: WishesAndDOOs CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend API Tests & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: wad_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: wishes_and_doos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install Dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        env:
          FLASK_ENV: testing
          DATABASE_URL: sqlite:///:memory:
          SECRET_KEY: test-secret-key-for-ci-pipeline-32b
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci-pip-32b
        run: |
          cd apps/api
          PYTHONPATH=. pytest -v

      - name: Verify Database Migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql://wad_user:test_password@localhost:5432/wishes_and_doos_test
          FLASK_AUTO_CREATE_DB: "false"
          FLASK_SEED_DEMO_DATA: "false"
        run: |
          cd apps/api
          PYTHONPATH=. flask --app wsgi.py db upgrade

  frontend-test:
    name: Frontend Typecheck, Tests & Export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/client/package-lock.json

      - name: Install Dependencies
        run: |
          cd apps/client
          npm ci || npm install

      - name: Run TypeScript Typecheck
        run: |
          cd apps/client
          npm run typecheck

      - name: Run Jest Unit Tests
        run: |
          cd apps/client
          npm test

      - name: Verify Production Web Export (expo export)
        run: |
          cd apps/client
          npx expo export --platform web
