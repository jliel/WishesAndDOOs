services:
  postgres:
    image: postgres:15-alpine
    container_name: wishes_and_doos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wad_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wad_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-wishes_and_doos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wad_user} -d ${POSTGRES_DB:-wishes_and_doos}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
